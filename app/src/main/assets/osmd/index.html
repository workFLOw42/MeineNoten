<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }
        #osmd-container {
            width: 100%;
            transform-origin: top center;
        }
        #status {
            font-family: sans-serif;
            padding: 24px;
            color: #b3261e;
            line-height: 1.5;
            display: none;
        }
    </style>
    <script src="opensheetmusicdisplay.min.js"></script>
</head>
<body>
    <div id="status"></div>
    <div id="osmd-container"></div>
    <script>
        var osmd = null;
        var pendingXml = null;

        // Reports back to Kotlin if the AndroidOsmd bridge is available.
        function report(type, message) {
            if (window.AndroidOsmd) {
                try { window.AndroidOsmd.onStatus(type, message || ""); } catch (e) {}
            }
        }

        function showError(message) {
            var el = document.getElementById("status");
            el.style.display = "block";
            el.textContent = message;
            report("error", message);
        }

        function initOsmd() {
            if (typeof opensheetmusicdisplay === "undefined") {
                showError("OpenSheetMusicDisplay konnte nicht geladen werden. " +
                          "Bitte 'opensheetmusicdisplay.min.js' in app/src/main/assets/osmd/ ablegen.");
                return false;
            }
            try {
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
                    autoResize: true,
                    backend: "svg",
                    drawTitle: true,
                    drawSubtitle: true,
                    drawComposer: true,
                    drawLyricist: true,
                    drawMetronomeMarks: true,
                    drawPartNames: true,
                    drawPartAbbreviations: true,
                    drawMeasureNumbers: true,
                    drawMeasureNumbersOnlyAtSystemStart: false,
                    drawFingerings: true,
                    fillEmptyMeasuresWithMultiMeasureRests: true,
                    cursorsOptions: [{ type: 0, color: "#33e02f", alpha: 0.5, follow: true }]
                });
                return true;
            } catch (e) {
                showError("OSMD konnte nicht initialisiert werden: " + e.message);
                return false;
            }
        }

        // Called from Kotlin. Returns immediately; completion is reported via the bridge.
        function loadMusicXML(xmlString) {
            if (!osmd) {
                pendingXml = xmlString;
                return;
            }
            document.getElementById("status").style.display = "none";
            report("loading", "");
            osmd.load(xmlString).then(function () {
                osmd.render();
                report("rendered", String(osmd.Sheet.SourceMeasures.length));
            }).catch(function (error) {
                showError("Die Notendatei konnte nicht gelesen werden: " + error);
            });
        }

        function setZoom(factor) {
            if (!osmd) return;
            osmd.Zoom = factor;
            osmd.render();
        }

        function setDarkMode(enabled) {
            document.body.style.backgroundColor = enabled ? "#000000" : "#ffffff";
            if (!osmd) return;
            osmd.setOptions({ defaultColorMusic: enabled ? "#FFFFFF" : "#000000" });
            osmd.render();
        }

        // Two-finger zoom. The viewport forbids browser zoom (it would only magnify the
        // page and push the score sideways off screen), so the gesture is handled here:
        // while the fingers move, the sheet is scaled with CSS for smooth feedback; on
        // release OSMD re-renders at the new zoom, so the notes stay sharp and the
        // measures re-wrap to the screen width. One finger still scrolls normally.
        var MIN_ZOOM = 0.5, MAX_ZOOM = 3;
        var pinchStartDist = 0, pinching = false, liveScale = 1;

        function touchDist(e) {
            var a = e.touches[0], b = e.touches[1];
            return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        }

        function clampZoom(z) { return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z)); }

        document.addEventListener("touchstart", function (e) {
            if (e.touches.length === 2 && osmd) {
                e.preventDefault();
                pinching = true;
                pinchStartDist = touchDist(e) || 1;
                liveScale = 1;
            }
        }, { passive: false });

        document.addEventListener("touchmove", function (e) {
            if (!pinching || e.touches.length < 2) return;
            e.preventDefault();
            var current = osmd.Zoom;
            liveScale = clampZoom(current * touchDist(e) / pinchStartDist) / current;
            document.getElementById("osmd-container").style.transform = "scale(" + liveScale + ")";
        }, { passive: false });

        function endPinch(e) {
            if (!pinching || e.touches.length >= 2) return;
            pinching = false;
            var container = document.getElementById("osmd-container");
            container.style.transform = "";
            var next = clampZoom(osmd.Zoom * liveScale);
            liveScale = 1;
            if (Math.abs(next - osmd.Zoom) < 0.02) return;
            // Keep the reading position: same relative scroll offset after re-rendering.
            var root = document.scrollingElement || document.documentElement;
            var ratio = root.scrollTop / Math.max(1, root.scrollHeight);
            osmd.Zoom = next;
            osmd.render();
            root.scrollTop = ratio * root.scrollHeight;
        }
        document.addEventListener("touchend", endPinch, { passive: false });
        document.addEventListener("touchcancel", endPinch, { passive: false });

        window.addEventListener("load", function () {
            if (initOsmd()) {
                report("ready", "");
                if (pendingXml !== null) {
                    loadMusicXML(pendingXml);
                    pendingXml = null;
                }
            }
        });
    </script>
</body>
</html>
