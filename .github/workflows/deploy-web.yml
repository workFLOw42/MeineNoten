name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'docs/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Build web app
        run: npm run build
        working-directory: ./web

      - name: Assemble site (docs + /app/)
        run: |
          mkdir -p public_html/app
          # Bestehende Seiten (Datenschutzerklärung etc.) weiterhin ausliefern
          cp -r docs public_html/docs
          cp -r docs/. public_html/
          # Web-App unter /app/
          cp -r web/dist/. public_html/app/
          # Weiterleitung von der Startseite auf die App, falls keine index.html existiert
          if [ ! -f public_html/index.html ]; then
            echo '<!doctype html><meta http-equiv="refresh" content="0; url=./app/"><a href="./app/">Meine Noten</a>' > public_html/index.html
          fi
          find public_html -maxdepth 2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public_html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
