<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Meine Noten</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" statt "black-translucent": iOS zeichnet die Statusleiste dann undurchsichtig
         über der App statt darüber, und nichts rutscht mehr darunter. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Meine Noten" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#121212" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        /* Dokument fest am Bildschirm: iOS darf die Seite weder verschieben noch zoomen,
           sonst rutscht die Kopfzeile unter die Statusleiste. Gescrollt wird nur in Listen. */
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: 0;
      }
      /* Abstand zur iOS-Statusleiste; --top-inset setzt main.ts, falls env() 0 liefert,
         die App aber trotzdem unter der Statusleiste beginnt (iPhone mit Home-Taste). */
      .app-root {
        padding: max(env(safe-area-inset-top, 0px), var(--top-inset, 0px)) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #121212;
        color: #e0e0e0;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
