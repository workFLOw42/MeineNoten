nav3 = "1.1.7"
material3Adaptive = "1.3.0"
material3AdaptiveNavigationSuite = "1.4.0"
datastore = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
